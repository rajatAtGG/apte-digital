<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>आप्टे कोश: Sanskrit-Hindi Dictionary</title>
  <meta name="description" content="V. S. Apte's Sanskrit-Hindi dictionary, fully offline.">
  <meta name="theme-color" content="#7a2e1d" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b1714" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="आप्टे कोश">
  <link rel="preload" href="fonts/noto-serif-devanagari-deva.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Apply theme and font size before first paint (no flash).
    try {
      const s = JSON.parse(localStorage.getItem('apte.settings') || '{}');
      if (s.theme && s.theme !== 'system') document.documentElement.dataset.theme = s.theme;
      if (s.fontScale) document.documentElement.style.setProperty('--scale', s.fontScale);
    } catch (e) { /* storage unavailable: defaults apply */ }
  </script>
</head>
<body>
  <header class="topbar">
    <div class="search-row" id="search-row">
      <button class="mode" id="mode" type="button" aria-label="Search direction"
              title="Switch between Sanskrit → Hindi and Hindi → Sanskrit">सं→हि</button>
      <input id="q" type="search" inputmode="search" enterkeyhint="search"
             autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
             lang="sa" placeholder="संस्कृत शब्द खोजें · धर्म, कमल" aria-label="खोजें">
    </div>
  </header>

  <main id="main">
    <div class="loading" id="loading" role="status">
      <div class="loading-title">आप्टे संस्कृत-हिन्दी कोश</div>
      <div class="loading-msg" id="loading-msg">Loading the dictionary…</div>
      <div class="bar"><div class="bar-fill" id="bar-fill"></div></div>
    </div>
    <section class="view" id="view-search" hidden></section>
    <section class="view" id="view-entry" hidden></section>
    <section class="view" id="view-browse" hidden></section>
    <section class="view" id="view-saved" hidden></section>
    <section class="view" id="view-settings" hidden></section>
    <section class="view" id="view-about" hidden></section>
  </main>

  <nav class="tabbar" aria-label="Sections">
    <a href="#/" data-tab="search"><span class="ti">⌕</span><span>खोज</span></a>
    <a href="#/browse" data-tab="browse"><span class="ti">अ</span><span>वर्णमाला</span></a>
    <a href="#/saved" data-tab="saved"><span class="ti">☆</span><span>सहेजे</span></a>
    <a href="#/settings" data-tab="settings"><span class="ti">⚙</span><span>सेटिंग</span></a>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
